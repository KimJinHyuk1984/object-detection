<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Roboflow와 Streamlit으로 만드는 자율주행 주행환경 인식 프로젝트. 50분씩 4차시 강의 안내.">
    <meta name="color-scheme" content="light dark">
    <title>자율주행 자동차 모델 만들기 · 강의 목록</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/lecture.css">
    <!-- 일반 스크립트를 사용하므로 file://에서도 데이터를 읽을 수 있습니다. -->
    <script src="data/site.js" defer>
    </script>
    <script src="assets/js/shared.js" defer>
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">
      본문으로 건너뛰기
    </a>
    <div class="scroll-progress" aria-hidden="true">
      <div class="scroll-progress__fill" data-progress>
      </div>
    </div>
    <header class="site-header" data-header>
      <div class="container header-inner">
        <a class="brand" href="#top" aria-label="강의 처음으로">
          <span class="brand-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v15M3 4h5a4 4 0 0 1 4 2 4 4 0 0 1 4-2h5v14h-5a4 4 0 0 0-4 2 4 4 0 0 0-4-2H3Z"/>
            </svg>
          </span>
          <span class="brand-title" data-lecture-title>
          </span>
        </a>
        <!-- shared.js가 본문의 .lecture-section을 수집해 링크를 생성합니다. -->
        <nav class="section-nav" aria-label="강의 섹션" data-section-nav>
        </nav>
        <div class="header-actions">
          <button class="button" type="button" data-presentation-toggle>
            발표 모드
            <kbd>
              P
            </kbd>
          </button>
          <button class="button button-primary" type="button" data-open-instructor>
            선생님 소개 보기
          </button>
          <button class="button button-icon" type="button" data-theme-toggle aria-label="테마 전환">
            <svg data-theme-icon width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div class="container">
        <section class="hero" id="top">
          <p class="kicker">ROBOFLOW × STREAMLIT · 50분 × 4차시</p>
          <h1>자율주행 자동차 모델 만들기</h1>
          <p class="hero-subtitle">객체와 주행 가능 영역을 배우는 단일 모델 프로젝트</p>
          <ul class="hub-fallback-links">
            <li><a href="road-perception/index.html">1차시 · AI에게 도로를 가르치기</a></li>
            <li><a href="model-training/index.html">2차시 · 모델을 학습하고 평가하기</a></li>
            <li><a href="api-app/index.html">3차시 · API로 이미지 앱 만들기</a></li>
            <li>4차시 · 주행영상 앱 배포하기 — 준비 중</li>
          </ul>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container footer-grid">
        <div class="footer-instructor">
          <div data-instructor-avatar>
          </div>
          <div>
            <strong data-instructor-name>
            </strong>
            <p data-instructor-affiliation>
            </p>
            <a class="footer-email" data-instructor-email>
            </a>
          </div>
        </div>
        <div data-other-lectures-region>
          <h2 class="footer-heading">
            다른 강의 둘러보기
          </h2>
          <div class="other-lectures" data-other-lectures>
          </div>
        </div>
      </div>
    </footer>
    <!-- 선생님 소개 모달의 내용은 shared.js가 SITE.instructor로 한 번만 생성합니다. -->
    <div class="sr-only" role="status" aria-live="polite" data-copy-status>
    </div>
    <noscript>
      강의 정보와 인터랙션을 표시하려면 브라우저에서 JavaScript를 켜 주세요.
    </noscript>
  </body>
</html>
